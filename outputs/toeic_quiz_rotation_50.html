<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 순환 퀴즈</title><style>body{font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f6fb;max-width:850px;margin:auto;padding:20px;color:#172033}.card{background:#fff;padding:15px;margin:12px 0;border-radius:12px}.choice{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid #ccd5e3;border-radius:8px;background:#fff}.selected{background:#eef2ff}.correct{background:#e6f7ed}.wrong{background:#ffeded}#summary{white-space:pre-wrap;background:#172033;color:#fff;padding:15px;border-radius:10px;display:none}.back{display:inline-block;margin-bottom:12px;padding:9px 14px;border-radius:8px;background:#e8eefb;color:#172033;text-decoration:none;font-weight:bold}</style><a class="back" href="toeic_study_dashboard.html">← 대시보드로 돌아가기</a><h1>TOEIC 순환 퀴즈</h1><p>회의·인사·재무·물류 등 TOEIC 실전 후보군</p><div id="summary"></div><button id="copyTop">결과 복사</button><div id="quiz"></div><button id="grade">채점하기</button><script src="toeic_quiz_items_1000.js"></script><script>
const L='ABCD',KEY='toeicRotationV1',N=Math.max(5,Math.min(100,+(new URLSearchParams(location.search).get('count')||50))),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},st=JSON.parse(localStorage.getItem(KEY)||'{"seen":[]}'),pool=TOEIC_ITEMS.filter(x=>!st.seen.includes(x.id));if(pool.length<N){st.seen=[];pool=TOEIC_ITEMS}const qs=sh(pool).slice(0,N).map(x=>{let p=Math.floor(Math.random()*4),o=sh(TOEIC_ITEMS.filter(y=>y.answer!==x.answer).map(y=>y.answer)).slice(0,3),c=[],k=0;for(let i=0;i<4;i++)c.push(i===p?x.answer:o[k++]);return{...x,c,a:p}}),ans=Array(N).fill(null),root=document.getElementById('quiz');qs.forEach((x,i)=>{let d=document.createElement('section');d.className='card';d.innerHTML='<h3>'+(i+1)+'. '+x.q+'의 뜻은?</h3>'+x.c.map((v,j)=>'<button class="choice" data-i="'+i+'" data-j="'+j+'">'+L[j]+'. '+v+'</button>').join('')+'<div id="r'+i+'"></div>';root.appendChild(d)});root.onclick=e=>{let b=e.target.closest('.choice');if(!b)return;ans[+b.dataset.i]=+b.dataset.j;b.parentElement.querySelectorAll('.choice').forEach(v=>v.classList.remove('selected'));b.classList.add('selected')};let result='';document.getElementById('grade').onclick=()=>{let score=0,bad=[];st.seen=[...new Set([...st.seen,...qs.map(x=>x.id)])];localStorage.setItem(KEY,JSON.stringify(st));qs.forEach((x,i)=>{let ok=ans[i]===x.a;if(ok)score++;else bad.push(x);root.querySelectorAll('[data-i="'+i+'"]').forEach((b,j)=>{if(j===x.a)b.classList.add('correct');if(j===ans[i]&&j!==x.a)b.classList.add('wrong')});document.getElementById('r'+i).textContent=ok?'정답':'정답: '+L[x.a]+'. '+x.c[x.a]});result=['TOEIC 단어 퀴즈','출제 수: '+N+'개','점수: '+score+'/'+N,'오답 번호: '+(bad.length?qs.map((x,i)=>ans[i]===x.a?null:i+1).filter(Boolean).join(', '):'없음'),'','오답 상세:',bad.length?bad.map(x=>x.q+' — '+x.answer).join(String.fromCharCode(10)):'없음'].join(String.fromCharCode(10));let s=document.getElementById('summary');s.style.display='block';s.textContent=result;scrollTo(0,0)};document.getElementById('copyTop').onclick=()=>{if(result)navigator.clipboard?.writeText(result);else alert('먼저 채점해 주세요.')};
</script>
