<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Study Dashboard</title><style>
:root{--ink:#172033;--muted:#697386;--bg:#f6f7fb;--card:#fff;--accent:#635bff;--mint:#dbf7ee;--line:#e7e9f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,"Malgun Gothic",sans-serif}main{max-width:1180px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#24204d,#635bff);color:white;border-radius:24px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{opacity:.75;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:8px 0 4px;font-size:34px}.hero p{margin:0;color:#dedcff}.grid{display:grid;grid-template-columns:1.3fr 2.35fr;gap:16px;margin-top:16px;align-items:stretch}.side-stack{display:grid;gap:16px;align-content:start}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #28335a0b}.card h2{font-size:17px;margin:0 0 14px}.big{font-size:34px;font-weight:800}.muted{color:var(--muted);font-size:13px}.moods{display:flex;gap:8px;flex-wrap:wrap}.mood{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-size:22px;cursor:pointer}.mood.active{border-color:var(--accent);background:#efeeff}.row{display:flex;gap:10px;align-items:center}.number{width:110px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:17px}.primary{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;margin:22px 0 14px}.tab{border:0;background:transparent;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700}.tab.active{background:#e9e8ff;color:#443bd1}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fafaff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:23px;margin-top:5px}.list{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:12px}.item{display:grid;grid-template-columns:1fr 1fr 110px;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}.item:last-child{border-bottom:0}.badge{font-size:12px;border-radius:99px;padding:4px 8px;background:#edf0f6;color:#566078;width:max-content}.badge.seen{background:#dbf7ee;color:#08785b}.badge.wrong{background:#fff0da;color:#a25a00}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:7px;text-align:center;font-size:12px;border-radius:8px}.today{background:#e9e8ff;color:#443bd1;font-weight:800}.weather{font-size:30px}.mini-calendar{margin-top:16px}.mini-calendar h3{font-size:14px;margin:0 0 8px}.mini-calendar .day{padding:4px;font-size:11px}.notice{margin-top:14px;background:#fff8df;border:1px solid #f3df9b;border-radius:12px;padding:12px;font-size:13px;color:#765d00}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{display:block}}
.forecast-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.weather-card{padding:16px}.forecast-day{min-width:76px;text-align:center;background:linear-gradient(180deg,#f7f7ff,#fff);border:1px solid var(--line);border-radius:14px;padding:10px 7px;box-shadow:0 4px 10px #635bff12}.forecast-day.today{border-color:var(--accent);background:#efeeff}.forecast-day .dow{font-weight:800;color:#443bd1;font-size:12px}.forecast-day .icon{font-size:23px;margin:6px 0}.forecast-day .temp{font-size:12px;font-weight:700}.forecast-day .low{color:#8b94a7;margin-right:3px}</style></head><body><main><section class="hero"><div><div class="eyebrow">Daily TOEIC Lab</div><h1>오늘의 학습 허브</h1><p>날씨를 확인하고, 기분을 고른 뒤 원하는 수만큼 출제하세요.</p></div><div class="muted" style="color:#d8d5ff" id="today"></div></section>
<section class="grid"><article class="card"><h2>오늘의 출제</h2><div class="row"><input id="count" class="number" type="number" min="5" max="100" value="50"><span class="muted">문제</span><button class="primary" id="start">오늘 단어 출제하기</button></div><div class="notice" id="status">순환 이력에서 미출제 단어를 우선 선택합니다.</div><div class="mini-calendar"><h3 id="month"></h3><div class="calendar" id="calendar"></div></div></article><div class="side-stack"><article class="card"><h2>오늘의 기분</h2><div class="moods" id="moods"><button class="mood" data-m="😀">😀</button><button class="mood" data-m="🙂">🙂</button><button class="mood" data-m="😐">😐</button><button class="mood" data-m="😴">😴</button><button class="mood" data-m="🔥">🔥</button></div><p class="muted" id="moodText">오늘 기분을 선택하세요.</p></article><article class="card weather-card"><h2 id="weatherTitle">내 지역 날씨</h2><div class="weather" id="weather">☁️</div><div id="weatherText">주간 예보를 불러오는 중…</div><div id="weatherWeek" class="forecast-row"></div><div class="muted">위치 권한이 없으면 서울을 기본값으로 사용합니다.</div></article></div></section>
<div class="tabs"><button class="tab active" data-tab="overview">요약</button><button class="tab" data-tab="words">단어 리스트</button></div><section id="overview" class="panel active"><div class="card"><h2>순환 학습 현황</h2><div class="stats"><div class="stat">전체 단어<b id="total">1,000</b></div><div class="stat">이번 순환 출제<b id="seen">0</b></div><div class="stat">미출제<b id="unseen">1,000</b></div><div class="stat">누적 오답<b id="wrong">0</b></div></div></div></section><section id="words" class="panel"><div class="card"><h2>전체 단어 모니터링</h2><div class="row" style="margin-bottom:12px"><input id="search" class="number" style="width:100%" placeholder="단어 검색"><span class="muted" id="wordCount"></span></div><div class="list" id="list"></div></div></section></main><script src="toeic_quiz_items_1000.js"></script><script>
const KEY='toeicRotationV1',state=JSON.parse(localStorage.getItem(KEY)||'{"seen":[]}'),wrongTerms=['learn by heart','contamination','stick to','go over','put up with','run out of','appliance'];const $=id=>document.getElementById(id);const now=new Date();$('today').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('seen').textContent=state.seen.length.toLocaleString();$('unseen').textContent=(1000-state.seen.length).toLocaleString();$('wrong').textContent=wrongTerms.length;$('start').onclick=()=>{let n=Math.max(5,Math.min(100,+$('count').value||50));location.href='toeic_quiz_rotation_50.html?count='+n;$('status').textContent=n+'개 출제를 준비했습니다.'};document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('moodText').textContent='오늘의 기분: '+b.dataset.m});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
const d=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0);$('month').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long'});let cal=['일','월','화','수','목','금','토'].map(x=>'<div class="day muted">'+x+'</div>').join('');for(let i=0;i<d.getDay();i++)cal+='<div></div>';for(let i=1;i<=last.getDate();i++)cal+='<div class="day '+(i===now.getDate()?'today':'')+'">'+i+'</div>';$('calendar').innerHTML=cal;function render(){let q=($('search').value||'').toLowerCase(),a=TOEIC_ITEMS.filter(x=>(x.q+' '+x.answer).toLowerCase().includes(q));$('wordCount').textContent=a.length+'개';$('list').innerHTML=a.map(x=>{let seen=state.seen.includes(x.id),bad=wrongTerms.includes(x.q);return '<div class="item"><b>'+x.q+'</b><span>'+x.answer+'</span><span class="badge '+(bad?'wrong':seen?'seen':'')+'">'+(bad?'오답 복습':seen?'기출제':'미출제')+'</span></div>'}).join('')}$('search').oninput=render;render();function loadWeather(lat=37.5665,lon=126.9780,label='서울'){let u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=auto';fetch(u).then(r=>r.json()).then(x=>{weatherTitle.textContent=label+' 주간 날씨';weather.textContent='🌤️';weatherText.textContent='7일 예보';weatherWeek.innerHTML=x.daily.time.map((d,i)=>'<div class="forecast-day"><div class="dow">'+new Date(d).toLocaleDateString('ko-KR',{weekday:'short',month:'numeric',day:'numeric'})+'</div><div class="icon">🌤️</div><div class="temp"><span class="low">'+x.daily.temperature_2m_min[i]+'°</span>'+x.daily.temperature_2m_max[i]+'°C</div></div>').join('')}).catch(()=>{weatherText.textContent='날씨 조회를 사용할 수 없습니다.'})}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>loadWeather(p.coords.latitude,p.coords.longitude,'내 지역'),()=>loadWeather());else loadWeather();
</script></body></html>
